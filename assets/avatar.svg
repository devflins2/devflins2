<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="avatarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#06090E" />
    </radialGradient>

    <!-- Refined Steel-Cyan Accent -->
    <linearGradient id="avatarCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Bevel Shading Gradients -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <style>
    .brand-wordmark {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 5px;
      fill: #E2E8F0;
    }
  </style>

  <!-- Circular Backdrop -->
  <rect width="400" height="400" fill="url(#avatarBg)" />

  <!-- Subtle Circular Framing Ring (Aligned with GitHub Avatar Circle) -->
  <circle cx="200" cy="200" r="182" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6" />
  <circle cx="200" cy="200" r="172" fill="none" stroke="url(#avatarCyan)" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Central Hexagonal Core Emblem -->
  <g transform="translate(200, 185)">
    <!-- Base Hex Shield -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" 
             fill="url(#bevelLight)" stroke="#1E293B" stroke-width="1.5" />
    <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" 
             fill="#080C14" stroke="url(#avatarCyan)" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- Modern Architectural "DF" Monogram -->
    <!-- D Outer Curve -->
    <path d="M -34 -44 L 8 -44 C 36 -44 52 -26 52 0 C 52 26 36 44 8 44 L -34 44 Z" 
          fill="none" stroke="url(#avatarCyan)" stroke-width="7" stroke-linejoin="round" />
    
    <!-- F Internal Struts (White & Steel-Cyan Accents) -->
    <path d="M -16 -24 L 24 -24 M -16 0 L 14 0 M -16 -24 L -16 26" 
          stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Accent Precision Dot -->
    <circle cx="24" cy="-24" r="3" fill="#38BDF8" />
  </g>

  <!-- Subtle Lower Wordmark Tag -->
  <text x="200" y="318" text-anchor="middle" class="brand-wordmark">DEVFLINS</text>
</svg>
