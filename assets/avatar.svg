<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="avatarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="60%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#04060A" />
    </radialGradient>

    <!-- Electric Cyan Neon Gradient -->
    <linearGradient id="avatarCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Metal Plate Gradient -->
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Core Glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="centerBurst" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .brand-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 5px;
      fill: #00F2FE;
    }
    .sub-code {
      font-family: 'SF Mono', Consolas, Monaco, monospace;
      font-size: 9px;
      letter-spacing: 2px;
      fill: #64748B;
    }
  </style>

  <!-- Circular Canvas Background -->
  <rect width="400" height="400" fill="url(#avatarBg)" />

  <!-- Center Energy Burst -->
  <circle cx="200" cy="180" r="160" fill="url(#centerBurst)" />

  <!-- Outer Tech Ring (Fits perfectly in 400x400 circle crop) -->
  <circle cx="200" cy="200" r="186" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#avatarCyan)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Ring Accent Ticks -->
  <line x1="200" y1="14" x2="200" y2="24" stroke="#00F2FE" stroke-width="2.5" />
  <line x1="200" y1="376" x2="200" y2="386" stroke="#00F2FE" stroke-width="2.5" />
  <line x1="14" y1="200" x2="24" y2="200" stroke="#00F2FE" stroke-width="2.5" />
  <line x1="376" y1="200" x2="386" y2="200" stroke="#00F2FE" stroke-width="2.5" />

  <!-- Outer Shield Hexagon -->
  <polygon points="200,45 325,117 325,263 200,335 75,263 75,117" 
           fill="url(#metalPlate)" stroke="url(#avatarCyan)" stroke-width="3" filter="url(#neonGlow)" />

  <!-- Inner Hexagon Bevel -->
  <polygon points="200,62 308,124 308,252 200,314 92,252 92,124" 
           fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5" />

  <!-- Futuristic Monogram: DEVFLINS Monogram Mark -->
  <!-- Stylized D and F geometric intersection -->
  <g transform="translate(132, 105)">
    <!-- Cyan Shadow / Glow Underlay -->
    <path d="M 12 10 L 70 10 C 105 10 126 30 126 62 C 126 94 105 114 70 114 L 12 114 Z" 
          fill="none" stroke="#00F2FE" stroke-width="14" stroke-opacity="0.25" filter="url(#neonGlow)" />
    
    <!-- Main D Frame -->
    <path d="M 12 10 L 70 10 C 105 10 126 30 126 62 C 126 94 105 114 70 114 L 12 114 Z" 
          fill="none" stroke="url(#avatarCyan)" stroke-width="9" stroke-linejoin="round" />
    
    <!-- Central F Wing / Cutout Core -->
    <path d="M 38 32 L 88 32 M 38 62 L 76 62 M 38 32 L 38 92" 
          stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

    <!-- Center Pulse Core -->
    <circle cx="88" cy="32" r="4" fill="#00F2FE" filter="url(#neonGlow)" />
    <circle cx="76" cy="62" r="3.5" fill="#38BDF8" filter="url(#neonGlow)" />
    <circle cx="38" cy="92" r="4" fill="#00F2FE" filter="url(#neonGlow)" />
  </g>

  <!-- Lower Branding Tag Plate -->
  <g transform="translate(110, 276)">
    <rect width="180" height="26" rx="5" fill="#080C14" stroke="url(#avatarCyan)" stroke-width="1" />
    <text x="90" y="17.5" text-anchor="middle" class="brand-name">DEVFLINS</text>
  </g>

  <!-- Precision Coordinate Marks -->
  <text x="200" y="322" text-anchor="middle" class="sub-code">EST. 2025 • ARCHITECT</text>
</svg>
