<svg width="100%" height="20" viewBox="0 0 900 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F2FE" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <filter id="divGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Thin Glowing Center Line -->
  <line x1="80" y1="10" x2="820" y2="10" stroke="url(#lineGrad)" stroke-width="1.5" filter="url(#divGlow)" />
  <!-- Central Diamond Accent -->
  <polygon points="450,4 456,10 450,16 444,10" fill="#00F2FE" filter="url(#divGlow)" />
  <circle cx="450" cy="10" r="1.5" fill="#FFFFFF" />
  <!-- Outer Node Dots -->
  <circle cx="280" cy="10" r="2" fill="#00F2FE" fill-opacity="0.6" />
  <circle cx="620" cy="10" r="2" fill="#38BDF8" fill-opacity="0.6" />
</svg>
