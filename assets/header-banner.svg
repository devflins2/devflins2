<svg width="100%" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="60%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <!-- Refined Steel-Cyan Accent Gradient -->
    <linearGradient id="steelCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Soft Ambient Highlights -->
    <radialGradient id="ambientGlow" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Mesh -->
    <pattern id="subtleGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-weight: 750;
      font-size: 34px;
      letter-spacing: 6px;
      fill: #F8FAFC;
    }
    .brand-role {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #38BDF8;
    }
    .brand-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 13px;
      line-height: 1.5;
      fill: #94A3B8;
    }
    .tech-item {
      font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      fill: #64748B;
    }
    .tech-highlight {
      fill: #38BDF8;
      font-weight: 600;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="900" height="200" rx="10" fill="url(#bgGrad)" />
  <rect width="900" height="200" rx="10" fill="url(#ambientGlow)" />
  <rect width="900" height="200" rx="10" fill="url(#subtleGrid)" />

  <!-- Hairline Frame Border with Muted Top Cyan Stroke -->
  <rect x="0.5" y="0.5" width="899" height="199" rx="9.5" fill="none" stroke="#1E293B" stroke-width="1" />
  <line x1="48" y1="0.5" x2="240" y2="0.5" stroke="url(#steelCyan)" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Monogram Logo Icon (Refined Minimal Geometric DF) -->
  <g transform="translate(48, 38)">
    <!-- Outer Hex Shield Frame -->
    <polygon points="26,2 50,16 50,44 26,58 2,44 2,16" 
             fill="#0E1626" stroke="#1E293B" stroke-width="1.5" />
    <polygon points="26,6 46,18 46,42 26,54 6,42 6,18" 
             fill="#080C14" stroke="url(#steelCyan)" stroke-width="1" stroke-opacity="0.7" />
    <!-- Sharp Modern Monogram Glyph -->
    <path d="M 18 20 L 30 20 C 34 20 37 23 37 27 C 37 31 34 34 30 34 L 22 34 L 22 40 L 18 40 Z M 22 24 L 22 30 L 29 30 C 31 30 32.5 29 32.5 27 C 32.5 25 31 24 29 24 Z" 
          fill="url(#steelCyan)" />
  </g>

  <!-- Typography Hierarchy -->
  <text x="116" y="62" class="brand-title">DEVFLINS</text>
  <text x="116" y="84" class="brand-role">Android &amp; Distributed Systems Developer</text>

  <!-- Descriptive Subtitle -->
  <text x="48" y="124" class="brand-desc">Architecting <tspan fill="#F1F5F9" font-weight="600">Anyfy</tspan> — open-source, privacy-first Android music streaming with Jetpack Compose &amp; ExoPlayer.</text>
  <text x="48" y="144" class="brand-desc">Focused on on-device audio stream resolution, foreground media engines, and real-time WebSocket sync.</text>

  <!-- Bottom Minimal Tech Rule -->
  <line x1="48" y1="166" x2="852" y2="166" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 4" />

  <!-- Compact Tech Tags -->
  <g transform="translate(48, 184)">
    <text class="tech-item">
      <tspan class="tech-highlight">Kotlin</tspan> • 
      <tspan class="tech-highlight">Jetpack Compose</tspan> • 
      <tspan class="tech-highlight">AndroidX Media3</tspan> • 
      <tspan>Room DB</tspan> • 
      <tspan>Node.js</tspan> • 
      <tspan>Socket.IO</tspan> • 
      <tspan>Python</tspan>
    </text>
  </g>
</svg>
